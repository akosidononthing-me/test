<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin-Client Video Call - Web App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff1f8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #5a2d48;
    }
    .wrap {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }
    h1 {
      color: #e74791;
      margin-top: 10px;
    }
    .panel {
      background: #fff;
      border: 1px solid #ffbfda;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 20px rgba(231, 71, 145, 0.08);
    }
    label {
      display: block;
      margin: 12px 0 4px;
      font-weight: 600;
    }
    input {
      width: 100%;
      border: 1px solid #eaa1c8;
      border-radius: 10px;
      padding: 11px;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #e74791;
    }
    .role-toggle {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .role-option {
      flex: 1;
      text-align: center;
      padding: 12px;
      border: 2px solid #eaa1c8;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      user-select: none;
      background: #fff;
    }
    .role-option.active {
      border-color: #e74791;
      background: #ffe3f0;
      color: #d43680;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      border: 0;
      border-radius: 12px;
      background: #e74791;
      color: white;
      font-weight: 700;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover { background: #d43680; }
    button.secondary { background: #895770; }
    button.secondary:hover { background: #73455d; }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .video-card {
      position: relative;
      background: #1b1320;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
    }
    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .video-label {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    #status {
      padding: 8px 0;
      font-weight: 600;
      color: #83476c;
    }
    small {
      color: #885f77;
      display: block;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>♡ Admin-Client Video Call Web App</h1>
    <div class="panel">
      <label for="server">Signaling WebSocket (WSS / WS)</label>
      <input id="server" value="wss://appweb-qnpe.onrender.com" placeholder="wss://appweb-qnpe.onrender.com" autocomplete="off">

      <label>Select Your Role</label>
      <div class="role-toggle">
        <div id="role-admin" class="role-option active" onclick="selectRole('admin')">Admin (Create Room)</div>
        <div id="role-client" class="role-option" onclick="selectRole('client')">Client (Join Room)</div>
      </div>

      <label for="room">Room Code (4–64 characters)</label>
      <input id="room" placeholder="Enter room code">

      <div class="controls">
        <button id="action-btn">Create Room (Admin)</button>
        <button class="secondary" id="hang">Leave Call</button>
        <button class="secondary" id="mute">Mute mic</button>
        <button class="secondary" id="camera">Camera off</button>
        <button class="secondary" id="flip">Switch camera</button>
      </div>

      <p id="status" aria-live="polite">Ready. Admin creates the room; Clients join using the room code (Max 4 participants).</p>
      <small>Only an Admin can create a new room. Clients can join once the room is created. Up to 4 total participants per room.</small>
    </div>

    <div class="video-grid" id="grid">
      <div class="video-card">
        <video id="local" autoplay playsinline muted></video>
        <div class="video-label" id="local-label">My Camera</div>
      </div>
    </div>
  </main>
  <script src="call.js"></script>
</body>
</html>
