<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>On-Tour | Client Camera Test</title><style>body{font:16px system-ui;background:#06101e;color:#edf5ff;margin:0;padding:24px}main{max-width:960px;margin:auto}.panel{background:#10243d;padding:20px;border-radius:14px;margin:14px 0}video{width:100%;background:#000;aspect-ratio:16/9;object-fit:contain;border-radius:10px}button,a{display:inline-block;padding:12px 18px;background:#1464d9;color:white;border:0;border-radius:8px;text-decoration:none;cursor:pointer}pre{white-space:pre-wrap;max-height:200px;overflow:auto;color:#9eb3d0}#status{color:#36df9d}</style></head><body data-role="client"><main><h1>On-Tour — Client Camera Test</h1><p>Start your camera to send video to the Admin page.</p><div class="panel"><h2>Your Camera</h2><video id="local" autoplay muted playsinline></video><p id="status">Connecting to signaling…</p><button id="start">Start Camera and Broadcast</button> <button id="stop">Stop Camera</button></div><div class="panel"><h3>Connection Log</h3><pre id="log"></pre></div><video id="remote" style="display:none"></video><button id="play" style="display:none">Play</button><p><a href="/admin" target="_blank">Open Admin</a></p></main><script src="/common.js"></script></body></html>
